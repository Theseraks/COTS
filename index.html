<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <style>
    .main-content { min-width: 0; background: #fff; }
    .dashboard-tabs {
    height: 40px;
    background: #dadada;
    border-bottom: 5px solid var(--orange);
    display: flex;
    align-items: stretch;
    }

    .active-tab {
    margin:0;
    padding:0 15px;
    display:flex;
    align-items:center;
    background:var(--orange);
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    }

    .dashboard-content { padding: 1px 1px 1px; }
    .quick-actions { display: flex; flex-wrap: wrap; gap: 6px 10px; margin-bottom: 1px; }
    .quick-action { padding: 5px 5px; }
    .summary-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
    .summary-card {
    min-width: 0;
    overflow: hidden;
    border: 1px solid #ddd;
    box-shadow: 0 1px 4px rgba(0,0,0,.14);
    }

    .card-body {
    min-height: 163px;
    padding: 16px 14px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
    color: #fff;
    }

    .metric-icon { width: 67px; height: 67px; align-self: flex-start; margin-top: 2px; }
    .card-metric {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
    text-align: right;
    min-width: 0;
    }

    .card-metric strong { font-size: 42px; line-height: 1; font-weight: 400; }
    .card-metric span { font-size: 13px; line-height: 1.35; }
    .card-footer {
    min-height: 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    font-size: 15px;
    font-weight: 600;
    }
  </style>

  <body>
    <nav class="navbar bg-secondary" >
    <div class="container-fluid mt2">
        <span class="navbar-brand mb-0 h1">COTS 1 ProWeb</span>
        <span class="navbar-brand mb-0 h1">Hi, 103092400056-Satria Ari Permana</span>
    </div>
    </nav>

    <nav class="navbar bg-body-tertiary">
        <div class="container-fluid">
            <div class="text-start">
                <button type="button"><img src="[SHARED] ICONS/ICONS/kotak-masuk-abu.svg" width="20" height="20">Incoming Letter</button>
                <button type="button"><img src="[SHARED] ICONS/ICONS/folder-abu.svg" width="20" height="20">My Folder</button>
            </div>
            <form class="d-flex input-group w-auto">
            <input
                type="search"
                class="form-control rounded"
                placeholder="Search"
                aria-label="Search"
                aria-describedby="search-addon"
            />
            <span class="input-group-text border-0" id="search-addon">
                <i class="fas fa-search"></i>
            </span>
            </form>
        </div>
    </nav>

    <main class="main-content">
                    <div class="dashboard-tabs">
                        <h2 class="active-tab">Dashboard</h2>
                    </div>

                <div class="dashboard-content">
                    <div class="quick-actions" aria-label="Buat surat">
                        <button type="button"><img src="[SHARED] ICONS/ICONS/folder-abu.svg" width="20" height="20">My Folder</button>

                        <a class="quick-action">
                            <img src="[SHARED] ICONS/ICONS/dokumen-abu.svg" alt="" class="icon icon-small" />
                            <span>Create External Letter</span>
                        </a>

                        <a class="quick-action">
                            <img src="[SHARED] ICONS/ICONS/dokumen-abu.svg" alt="" class="icon icon-small" />
                            <span>Create Invitational Letter</span>
                        </a>
                    </div>

                    <section class="summary-cards" aria-label="Kartu ringkasan dashboard">
                        <article class="summary-card green-card">
                            <div class="card-body">
                                <img src="kotak-masuk-putih.svg" alt="" class="icon metric-icon" />
                                <div class="card-metric"><strong>0</strong><span>Need Follow Up</span></div>
                            </div>

                            <a class="card-footer">
                                <span>View Details</span>
                                <img src="panah-hijau.svg" alt="" class="icon icon-arrow" />
                            </a>
                        </article>

                        <article class="summary-card blue-card">
                            <div class="card-body">
                                <img src="dokumen-putih.svg" alt="" class="icon metric-icon" />
                                <div class="card-metric"><strong>0</strong><span>Incoming Letter</span></div>
                            </div>

                            <a class="card-footer">
                                <span>View Details</span>
                                <img src="panah-biru.svg" alt="" class="icon icon-arrow" />
                            </a>
                        </article>

                        <article class="summary-card red-card">
                            <div class="card-body">
                                <img src="percakapan-putih.svg" class="icon metric-icon" />
                                <div class="card-metric"><strong>0</strong><span>Disposition</span></div>
                            </div>

                            <a class="card-footer">
                                <span>View Details</span>
                                <img src="panah-merah.svg" class="icon icon-arrow" />
                            </a>
                        </article>
                    </section>

                    <section class="todo-section" aria-labelledby="todo-heading">
                        <div class="todo-panel">
                            <h2 id="todo-heading">Todo</h2>
                            <form class="todo-search" action="#" role="search">
                                <input type="search" placeholder="Search todo..." aria-label="Cari todo" />
                                <button type="submit" aria-label="Cari todo">
                                    <img src="cari-abu-gelap.svg" alt="" class="icon icon-search" />
                                </button>
                            </form>
                        </div>
                        <p class="todo-empty"><em>You don't have ToDo</em></p>
                    </section>
                </div>
            </main>
  </body>
</html>
